apiVersion: apps/v1
kind: Deployment
metadata:
  name: net-kourier-controller
  namespace: knative-serving
  labels:
    networking.knative.dev/ingress-provider: kourier
    app.kubernetes.io/component: net-kourier
    app.kubernetes.io/version: 1.22.1
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: falcone-knative
    falcone.io/knative-bundle-version: 1.22.1
    falcone.io/knative-owner: __FALCONE_OWNER__
    falcone.io/install-stage: kourier
  annotations:
    falcone.io/upstream-release: knative-v1.22.1
    falcone.io/knative-owner: __FALCONE_OWNER__
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  replicas: 1
  selector:
    matchLabels:
      app: net-kourier-controller
  template:
    metadata:
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
      labels:
        app: net-kourier-controller
    spec:
      containers:
      - image: gcr.io/knative-releases/knative.dev/net-kourier/cmd/kourier@sha256:01abd2070ccf8680885c47990e42c05c09e30bc8595d9246f4dcd37f2220a2a2
        name: controller
        env:
        - name: CERTS_SECRET_NAMESPACE
          value: ''
        - name: CERTS_SECRET_NAME
          value: ''
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: METRICS_DOMAIN
          value: knative.dev/samples
        - name: KOURIER_GATEWAY_NAMESPACE
          value: kourier-system
        - name: ENABLE_SECRET_INFORMER_FILTERING_BY_CERT_UID
          value: 'false'
        - name: KUBE_API_BURST
          value: '200'
        - name: KUBE_API_QPS
          value: '200'
        ports:
        - name: http2-xds
          containerPort: 18000
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        readinessProbe:
          grpc:
            port: 18000
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          grpc:
            port: 18000
          periodSeconds: 10
          failureThreshold: 6
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
          limits:
            cpu: '1'
            memory: 500Mi
      restartPolicy: Always
      serviceAccountName: net-kourier
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
