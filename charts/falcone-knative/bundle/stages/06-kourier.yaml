---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: 3scale-kourier-gateway
  namespace: kourier-system
  labels:
    networking.knative.dev/ingress-provider: kourier
    app.kubernetes.io/component: net-kourier
    app.kubernetes.io/version: 1.22.1
    app.kubernetes.io/name: knative-serving
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: falcone-knative
    falcone.io/knative-bundle-version: 1.22.1
    falcone.io/knative-owner: __FALCONE_OWNER__
    falcone.io/install-stage: kourier
  annotations:
    falcone.io/upstream-release: knative-v1.22.1
    falcone.io/knative-owner: __FALCONE_OWNER__
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 100%
  selector:
    matchLabels:
      app: 3scale-kourier-gateway
  template:
    metadata:
      labels:
        app: 3scale-kourier-gateway
      annotations:
        networking.knative.dev/poke: v0.26
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9000'
        prometheus.io/path: /stats/prometheus
    spec:
      containers:
      - args:
        - --base-id 1
        - -c /tmp/config/envoy-bootstrap.yaml
        - --log-level info
        - --drain-time-s $(DRAIN_TIME_SECONDS)
        - --drain-strategy immediate
        command:
        - /usr/local/bin/envoy
        env:
        - name: DRAIN_TIME_SECONDS
          value: '15'
        image: docker.io/envoyproxy/envoy@sha256:1c2b79776c6e3b38e8b0113b825e6a599f9bfc08d680c199d80bf8964856c529
        name: kourier-gateway
        ports:
        - name: http2-external
          containerPort: 8080
          protocol: TCP
        - name: http2-internal
          containerPort: 8081
          protocol: TCP
        - name: https-external
          containerPort: 8443
          protocol: TCP
        - name: http-probe
          containerPort: 8090
          protocol: TCP
        - name: https-probe
          containerPort: 9443
          protocol: TCP
        - name: metrics
          containerPort: 9000
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          runAsNonRoot: true
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - name: config-volume
          mountPath: /tmp/config
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - curl -X POST http://localhost:9901/drain_listeners?graceful; sleep $DRAIN_TIME_SECONDS
        readinessProbe:
          httpGet:
            httpHeaders:
            - name: Host
              value: internalkourier
            path: /ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 3
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            httpHeaders:
            - name: Host
              value: internalkourier
            path: /ready
            port: 8081
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 6
          timeoutSeconds: 3
        resources:
          requests:
            cpu: 200m
            memory: 200Mi
          limits:
            cpu: '1'
            memory: 800Mi
      terminationGracePeriodSeconds: 30
      volumes:
      - name: config-volume
        configMap:
          name: kourier-bootstrap
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
---
