{{- if .Values.openbao.authReconcile.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-auth-reconciler
  namespace: {{ .Values.openbao.namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-policy-auth-reconcile
  namespace: {{ .Values.openbao.namespace }}
data:
  auth-reconcile.hcl: |
    path "auth/kubernetes/config" { capabilities = ["read", "update"] }
    path "auth/kubernetes/role/{{ .Values.openbao.authReconcile.roleName }}" { capabilities = ["read", "update"] }
    path "auth/token/lookup-self" { capabilities = ["read"] }
    path "auth/token/revoke-self" { capabilities = ["update"] }
    path "sys/policies/acl" { capabilities = ["list"] }
{{- end }}
