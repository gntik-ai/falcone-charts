apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: {{ .Values.openbao.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-bootstrap
  namespace: {{ .Values.openbao.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.eso.serviceAccountName | default "eso-openbao-auth" }}
  namespace: {{ .Values.eso.namespace | default "eso-system" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-token-reviewer
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-reviewer
subjects:
  - kind: ServiceAccount
    name: openbao
    namespace: {{ .Values.openbao.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-token-reviewer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-platform-secret-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - in-falcone-postgresql
      - in-falcone-postgresql-vector
      - in-falcone-documentdb
      - in-falcone-ferretdb
      - in-falcone-documentdb-replication
      - in-falcone-kafka
      - in-falcone-storage
      - in-falcone-keycloak-admin
      - in-falcone-identity-client
      - in-falcone-superadmin
      - in-falcone-apisix-admin
      - in-falcone-gateway-shared-secret
      - in-falcone-temporal
      - in-falcone-encryption
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-platform-secret-reader
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: {{ .Values.openbao.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-platform-secret-reader
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-recovery-secret-writer
  namespace: {{ .Values.openbao.namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - {{ .Values.openbao.recovery.secretName }}
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-recovery-secret-writer
  namespace: {{ .Values.openbao.namespace }}
subjects:
  - kind: ServiceAccount
    name: openbao-bootstrap
    namespace: {{ .Values.openbao.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-recovery-secret-writer
