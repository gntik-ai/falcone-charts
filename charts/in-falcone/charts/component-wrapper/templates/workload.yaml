{{- $workloadKind := .Values.wrapper.workload.kind | default "Deployment" -}}
{{- $podSecurityContext := mergeOverwrite (deepCopy (default (dict) .Values.global.podSecurity)) (default (dict) .Values.podSecurityContext) -}}
{{- if (.Values.global.podSecurity.openshiftRestricted | default false) -}}
  {{- $_ := unset $podSecurityContext "runAsUser" -}}
  {{- $_ := unset $podSecurityContext "runAsGroup" -}}
  {{- $_ := unset $podSecurityContext "fsGroup" -}}
  {{- $_ := unset $podSecurityContext "fsGroupChangePolicy" -}}
  {{- $_ := unset $podSecurityContext "openshiftRestricted" -}}
{{- end -}}
{{- /* Normalize pull secrets to a string list: global.imagePullSecrets items may
       be strings or {name: ...} maps; global.privateRegistry.pullSecretNames
       items are strings (per values.schema.json). */ -}}
{{- $imagePullSecrets := list -}}
{{- range (default (list) .Values.global.imagePullSecrets) -}}
  {{- if kindIs "map" . -}}
    {{- $imagePullSecrets = append $imagePullSecrets .name -}}
  {{- else -}}
    {{- $imagePullSecrets = append $imagePullSecrets . -}}
  {{- end -}}
{{- end -}}
{{- range (default (list) .Values.global.privateRegistry.pullSecretNames) -}}
  {{- $imagePullSecrets = append $imagePullSecrets . -}}
{{- end -}}
{{- $imagePullSecrets = $imagePullSecrets | uniq -}}
{{- /* In-transit TLS injection (harden-datastore-transport-tls / #645): when the umbrella's
       global.transportSecurity is enabled AND this component opts in (transportSecurityClient),
       append the shared TLS env and mount the CA secret. No-op otherwise, so default renders
       are byte-identical. */ -}}
{{- $ts := default (dict) .Values.global.transportSecurity -}}
{{- $tsOn := and .Values.transportSecurityClient ($ts.enabled | default false) -}}
{{- $tsEnv := ternary (default (list) $ts.env) (list) $tsOn -}}
{{- $tsCa := and $tsOn (ne (default "" $ts.caSecretName) "") -}}
{{- /* A projected Knative status lease is consumed only by the two application
       components. The application gets an emptyDir; a tokenless sidecar alone
       sees the optional source ConfigMap and atomically materializes status.json. */ -}}
{{- $knativeRuntime := default (dict) .Values.global.knativeRuntime -}}
{{- $knativeMode := $knativeRuntime.mode | default "disabled" -}}
{{- $knativeRuntimeConsumer := and
      (has $knativeMode (list "managed" "external"))
      (has (.Values.wrapper.componentId | default "") (list "control-plane" "control-plane-executor")) -}}
{{- $knativeOwner := $knativeRuntime.owner | default .Release.Name -}}
{{- $knativeSourceVolume := "falcone-knative-runtime-source" -}}
{{- $knativeMaterializedVolume := "falcone-knative-runtime" -}}
{{- $knativeAppTokenVolume := "falcone-application-api-token" -}}
{{- $postgresTsEnv := list -}}
{{- if $tsOn -}}
  {{- range $tsEnv -}}
    {{- if has (.name | default "") (list "PGSSLMODE" "PGSSLROOTCERT") -}}
      {{- $postgresTsEnv = append $postgresTsEnv . -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
{{- /* C-25 webhook master-key injection is deliberately alias-specific. Globals
       are visible to this dependency, while no generic component value accepts
       key material or an override env entry. */ -}}
{{- $webhookKey := default (dict) .Values.global.webhookSigningKey -}}
{{- $webhookDatabase := default (dict) .Values.global.webhookDatabase -}}
{{- $webhookDatabaseCredentials := default (dict) $webhookDatabase.credentials -}}
{{- $webhookDatabasePrincipals := default (dict) $webhookDatabase.principals -}}
{{- $isControlPlane := and (eq (.Values.wrapper.componentId | default "") "control-plane") (gt (len $webhookKey) 0) -}}
{{- $databaseGateSecurityContext := deepCopy (default (dict) $webhookDatabase.securityContext) -}}
{{- if (.Values.global.podSecurity.openshiftRestricted | default false) -}}
  {{- $_ := unset $databaseGateSecurityContext "runAsUser" -}}
  {{- $_ := unset $databaseGateSecurityContext "runAsGroup" -}}
{{- end -}}
{{- $webhookKeyId := "" -}}
{{- $webhookMode := "canonical-v1" -}}
{{- $webhookAction := "none" -}}
{{- $webhookRequestId := "" -}}
{{- $webhookRotationId := "" -}}
{{- if $isControlPlane -}}
  {{- $webhookKeyId = printf "wk1:%s" (sha256sum (printf "%s/%s/%s" .Release.Namespace $webhookKey.secretName $webhookKey.secretKey)) -}}
  {{- $webhookAction = $webhookKey.rotation.action | default "none" -}}
  {{- $webhookRequestId = $webhookKey.rotation.requestId | default $webhookKey.adoption.requestId | default "" -}}
  {{- $webhookRotationId = $webhookKey.rotation.rotationId | default "" -}}
  {{- if and (eq ($webhookKey.adoption.mode | default "none") "legacy") (ne $webhookAction "rotate") -}}
    {{- $webhookMode = "legacy" -}}
  {{- end -}}
{{- end -}}
{{- $podAnnotations := deepCopy (default (dict) .Values.podAnnotations) -}}
{{- $workloadAnnotations := dict -}}
{{- $build := default (dict) .Values.global.openshiftBuild -}}
{{- if and $build.enabled (has (.Values.wrapper.componentId | default "") (list "control-plane" "control-plane-executor" "web-console" "workflow-worker")) -}}
  {{- $stream := printf "in-falcone-%s" .Values.wrapper.componentId -}}
  {{- $_ := set $workloadAnnotations "image.openshift.io/triggers" (printf "[{\"from\":{\"kind\":\"ImageStreamTag\",\"name\":\"%s:%s\",\"namespace\":\"%s\"},\"fieldPath\":\"spec.template.spec.containers[?(@.name==\\\"%s\\\")].image\"}]" $stream ($build.tag | default "latest") .Release.Namespace .Values.wrapper.componentId) -}}
{{- end -}}
{{- if $isControlPlane -}}
  {{- $_ := set $podAnnotations "in-falcone.io/release-revision" (printf "%d" (.Release.Revision | int)) -}}
  {{- $_ := set $podAnnotations "in-falcone.io/webhook-key-id" $webhookKeyId -}}
  {{- $_ := set $podAnnotations "in-falcone.io/webhook-key-mode" $webhookMode -}}
  {{- $_ := set $podAnnotations "in-falcone.io/webhook-key-action" $webhookAction -}}
  {{- if $webhookRequestId }}{{- $_ := set $podAnnotations "in-falcone.io/webhook-key-request-id" $webhookRequestId -}}{{- end -}}
  {{- if $webhookRotationId }}{{- $_ := set $podAnnotations "in-falcone.io/webhook-key-rotation-id" $webhookRotationId -}}{{- end -}}
{{- end -}}
apiVersion: apps/v1
kind: {{ $workloadKind }}
metadata:
  name: {{ include "component-wrapper.fullname" . }}
  {{- with $workloadAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "component-wrapper.labels" . | nindent 4 }}
spec:
  {{- if eq $workloadKind "StatefulSet" }}
  serviceName: {{ include "component-wrapper.fullname" . }}
  {{- end }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "component-wrapper.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "component-wrapper.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with $podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "component-wrapper.serviceAccountName" . }}
      automountServiceAccountToken: {{ ternary false (.Values.serviceAccount.automountToken | default false) $knativeRuntimeConsumer }}
      enableServiceLinks: false
      {{- if gt (len $imagePullSecrets) 0 }}
      imagePullSecrets:
        {{- range $imagePullSecrets }}
        - name: {{ . }}
        {{- end }}
      {{- end }}
      {{- if gt (len $podSecurityContext) 0 }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      {{- end }}
      {{- if or $isControlPlane (and .Values.persistence.enabled .Values.volumePermissions.enabled) (gt (len .Values.initContainers) 0) }}
      initContainers:
        {{- if $isControlPlane }}
        # Fresh installs render the authority bootstrap as a normal Job because
        # bundled PostgreSQL does not exist during pre-install hooks. This
        # bounded-schema gate prevents application DDL/listen until that Job has
        # established and verified the exact PostgreSQL 16 role graph.
        - name: webhook-database-principal-gate
          image: {{ include "component-wrapper.renderImage" (dict "Values" .Values "image" $webhookDatabase.bootstrapImage "name" "webhook database principal gate") | quote }}
          imagePullPolicy: {{ $webhookDatabase.bootstrapImage.pullPolicy | default "IfNotPresent" }}
          command: ["/bin/sh", "/scripts/principal-gate.sh"]
          env:
            - name: PGHOST
              value: {{ tpl $webhookDatabase.connection.host . | quote }}
            - name: PGPORT
              value: {{ $webhookDatabase.connection.port | quote }}
            - name: PGDATABASE
              value: {{ $webhookDatabase.connection.database | quote }}
            - name: PGUSER
              value: {{ $webhookDatabasePrincipals.schema | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookDatabaseCredentials.secretName | quote }}
                  key: WEBHOOK_SCHEMA_DATABASE_PASSWORD
                  optional: false
            - name: WEBHOOK_SCHEMA_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.schema | quote }}
            - name: WEBHOOK_RUNTIME_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.runtime | quote }}
            - name: WEBHOOK_KEY_WRITE_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.writer | quote }}
            - name: WEBHOOK_KEY_LIFECYCLE_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.lifecycle | quote }}
            - name: WEBHOOK_DATABASE_AUTHORITY_GRANTOR_ROLE
              value: {{ $webhookDatabasePrincipals.grantor | quote }}
            {{- with $postgresTsEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: webhook-database-principal-gate
              mountPath: /scripts
              readOnly: true
            {{- if $tsCa }}
            - name: falcone-transport-ca
              mountPath: {{ $ts.caMountPath | default "/etc/falcone/tls" }}
              readOnly: true
            {{- end }}
          securityContext:
            {{- toYaml $databaseGateSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $webhookDatabase.resources | nindent 12 }}
        {{- end }}
        {{- if and .Values.persistence.enabled .Values.volumePermissions.enabled }}
        - name: volume-permissions
          image: {{ include "component-wrapper.renderImage" (dict "Values" .Values "image" .Values.volumePermissions.image "name" (printf "%s volumePermissions" (include "component-wrapper.name" .))) | quote }}
          imagePullPolicy: {{ .Values.volumePermissions.image.pullPolicy | default "IfNotPresent" }}
          command:
            {{- toYaml (.Values.volumePermissions.command | default (list "sh" "-ec" (printf "mkdir -p %s && chmod -R g+rwX %s" .Values.persistence.mountPath .Values.persistence.mountPath))) | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
          securityContext:
            {{- toYaml .Values.volumePermissions.securityContext | nindent 12 }}
        {{- end }}
        {{- with .Values.initContainers }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ include "component-wrapper.name" . }}
          image: {{ include "component-wrapper.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with .Values.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.ports }}
          ports:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.env (gt (len $tsEnv) 0) $isControlPlane $knativeRuntimeConsumer }}
          env:
            {{- if $isControlPlane }}
            - name: WEBHOOK_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookKey.secretName | quote }}
                  key: {{ $webhookKey.secretKey | quote }}
                  optional: false
            - name: WEBHOOK_SIGNING_KEY_MODE
              value: {{ $webhookMode | quote }}
            - name: WEBHOOK_SIGNING_KEY_ID
              value: {{ $webhookKeyId | quote }}
            - name: WEBHOOK_SIGNING_KEY_MANAGED
              value: {{ ternary "true" "false" $webhookKey.create | quote }}
            - name: WEBHOOK_SCHEMA_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookDatabaseCredentials.secretName | quote }}
                  key: WEBHOOK_SCHEMA_DATABASE_URL
                  optional: false
            - name: WEBHOOK_RUNTIME_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookDatabaseCredentials.secretName | quote }}
                  key: WEBHOOK_RUNTIME_DATABASE_URL
                  optional: false
            - name: WEBHOOK_KEY_WRITE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookDatabaseCredentials.secretName | quote }}
                  key: WEBHOOK_KEY_WRITE_DATABASE_URL
                  optional: false
            - name: WEBHOOK_KEY_LIFECYCLE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $webhookDatabaseCredentials.secretName | quote }}
                  key: WEBHOOK_KEY_LIFECYCLE_DATABASE_URL
                  optional: false
            - name: WEBHOOK_SCHEMA_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.schema | quote }}
            - name: WEBHOOK_RUNTIME_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.runtime | quote }}
            - name: WEBHOOK_KEY_WRITE_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.writer | quote }}
            - name: WEBHOOK_KEY_LIFECYCLE_DATABASE_ROLE
              value: {{ $webhookDatabasePrincipals.lifecycle | quote }}
            - name: WEBHOOK_DATABASE_AUTHORITY_GRANTOR_ROLE
              value: {{ $webhookDatabasePrincipals.grantor | quote }}
            {{- end }}
            {{- with .Values.env }}
            {{- tpl (toYaml .) $ | nindent 12 }}
            {{- end }}
            {{- if $knativeRuntimeConsumer }}
            - name: KNATIVE_RUNTIME_MODE
              value: {{ $knativeMode | quote }}
            - name: KNATIVE_RUNTIME_STATUS_FILE
              value: "/var/run/falcone/knative/status.json"
            {{- end }}
            {{- with $tsEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if or (gt (len .Values.envFromSecrets) 0) (gt (len .Values.envFromConfigMaps) 0) (and .Values.config.inline (gt (len .Values.config.inline) 0)) }}
          envFrom:
            {{- if and .Values.config.inline (gt (len .Values.config.inline) 0) }}
            - configMapRef:
                name: {{ include "component-wrapper.generatedConfigMapName" . }}
            {{- end }}
            {{- range .Values.envFromConfigMaps }}
            - configMapRef:
                name: {{ . }}
            {{- end }}
            {{- range .Values.envFromSecrets }}
            - secretRef:
                name: {{ . }}
            {{- end }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.persistence.enabled (gt (len .Values.extraVolumeMounts) 0) $tsCa $knativeRuntimeConsumer }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $knativeRuntimeConsumer }}
            - name: {{ $knativeMaterializedVolume }}
              mountPath: /var/run/falcone/knative
            {{- if .Values.serviceAccount.automountToken }}
            # Keep Kubernetes credentials available to the application without
            # exposing them to the runtime-status guard sidecar.
            - name: {{ $knativeAppTokenVolume }}
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $tsCa }}
            - name: falcone-transport-ca
              mountPath: {{ $ts.caMountPath | default "/etc/falcone/tls" }}
              readOnly: true
            {{- end }}
          {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.startupProbe }}
          startupProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        {{- if $knativeRuntimeConsumer }}
        - name: knative-runtime-status-guard
          image: {{ include "component-wrapper.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          command: ["node", "-e"]
          args:
            - |
              'use strict';
              const fs = require('node:fs');
              const path = require('node:path');
              const source = process.env.RUNTIME_STATUS_SOURCE;
              const target = process.env.RUNTIME_STATUS_TARGET;
              const mode = process.env.RUNTIME_STATUS_EXPECTED_MODE;
              const owner = process.env.KNATIVE_RUNTIME_OWNER;
              const version = process.env.KNATIVE_RUNTIME_VERSION;
              const interval = Number(process.env.RUNTIME_STATUS_LEASE_CHECK_INTERVAL_MS);
              const maxBytes = 16 * 1024;
              const maxLeaseMs = 5 * 60 * 1000;
              const maxClockSkewMs = 60 * 1000;
              const modes = new Set(['managed', 'external']);
              const compatibility = new Set(['compatible', 'incompatible', 'unverified']);
              const states = new Set(['ready', 'unverified', 'degraded', 'unavailable', 'disabled']);
              const stages = new Set(['configured', 'preflight', 'crds', 'webhook', 'serving', 'kourier', 'smoke', 'ready', 'disabled', 'external_validation', 'unknown']);
              const canaryStates = new Set(['verified', 'missing', 'unreadable', 'invoke_failed']);
              const reasonPattern = /^[A-Z][A-Z0-9_]{0,63}$/;
              const safeNamePattern = /^[a-z0-9]([-a-z0-9]*[a-z0-9])?$/;
              function unavailable(reason) {
                const now = new Date().toISOString();
                return {
                  schemaVersion: 'falcone.knative-runtime/v1', mode, owner, version,
                  compatibility: 'unverified',
                  readiness: { state: 'unavailable', stage: 'unknown', reason, lastTransitionAt: now },
                  observedAt: now, validUntil: now,
                };
              }
              function validateLease(document) {
                if (!document || document.schemaVersion !== 'falcone.knative-runtime/v1') return 'STATUS_SOURCE_INVALID';
                if (!modes.has(document.mode) || document.mode !== mode) return 'STATUS_SOURCE_INVALID';
                if (!safeNamePattern.test(document.owner || '') || document.owner !== owner) return 'STATUS_OWNER_MISMATCH';
                if (document.version !== version || !compatibility.has(document.compatibility)) return 'STATUS_SOURCE_INVALID';
                const readiness = document.readiness;
                if (!readiness || !states.has(readiness.state) || !stages.has(readiness.stage) || !reasonPattern.test(readiness.reason || '')) return 'STATUS_SOURCE_INVALID';
                const transition = Date.parse(readiness.lastTransitionAt);
                const observed = Date.parse(document.observedAt);
                const validUntil = Date.parse(document.validUntil);
                if (![transition, observed, validUntil].every(Number.isFinite) || observed > validUntil) return 'STATUS_SOURCE_INVALID';
                if (validUntil - observed > maxLeaseMs || observed > Date.now() + maxClockSkewMs) return 'LEASE_INVALID';
                if (mode === 'external' && (!document.externalCanary || !canaryStates.has(document.externalCanary.state))) return 'STATUS_SOURCE_INVALID';
                if (validUntil <= Date.now()) return 'LEASE_EXPIRED';
                return '';
              }
              function readCurrentLease() {
                try {
                  const stat = fs.statSync(source);
                  if (!stat.isFile() || stat.size <= 0 || stat.size > maxBytes) return unavailable('STATUS_SOURCE_INVALID');
                  const document = JSON.parse(fs.readFileSync(source, 'utf8'));
                  const reason = validateLease(document);
                  return reason ? unavailable(reason) : document;
                } catch (error) {
                  return unavailable(error && error.code === 'ENOENT' ? 'STATUS_SOURCE_MISSING' : 'STATUS_SOURCE_INVALID');
                }
              }
              function atomicMaterialize(document) {
                const directory = path.dirname(target);
                const temporary = path.join(directory, `.status.json.${process.pid}.tmp`);
                fs.writeFileSync(temporary, `${JSON.stringify(document)}\n`, { encoding: 'utf8', mode: 0o444 });
                fs.renameSync(temporary, target);
              }
              function refreshMaterializedStatus() {
                try {
                  atomicMaterialize(readCurrentLease());
                } catch (error) {
                  // Never leave stale ready state when atomic replacement cannot complete.
                  try { fs.rmSync(target, { force: true }); } catch {}
                }
              }
              refreshMaterializedStatus();
              setInterval(refreshMaterializedStatus, interval).unref();
              setInterval(() => {}, 0x7fffffff);
          env:
            - name: RUNTIME_STATUS_SOURCE
              value: /var/run/falcone/knative-source/status.json
            - name: RUNTIME_STATUS_TARGET
              value: /var/run/falcone/knative/status.json
            - name: RUNTIME_STATUS_EXPECTED_MODE
              value: {{ $knativeMode | quote }}
            - name: KNATIVE_RUNTIME_OWNER
              value: {{ $knativeOwner | quote }}
            - name: KNATIVE_RUNTIME_VERSION
              value: "1.22.1"
            - name: RUNTIME_STATUS_LEASE_CHECK_INTERVAL_MS
              value: "5000"
          volumeMounts:
            - name: {{ $knativeSourceVolume }}
              mountPath: /var/run/falcone/knative-source
              readOnly: true
            - name: {{ $knativeMaterializedVolume }}
              mountPath: /var/run/falcone/knative
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 100m
              memory: 64Mi
        {{- end }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if or $isControlPlane .Values.persistence.enabled (gt (len .Values.extraVolumes) 0) $tsCa $knativeRuntimeConsumer }}
      volumes:
        {{- if $isControlPlane }}
        - name: webhook-database-principal-gate
          configMap:
            name: {{ printf "%s-webhook-db-principal-gate" .Release.Name | trunc 63 | trimSuffix "-" }}
            defaultMode: 0555
        {{- end }}
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "component-wrapper.persistenceClaimName" . }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- tpl (toYaml .) $ | nindent 8 }}
        {{- end }}
        {{- if $knativeRuntimeConsumer }}
        - name: {{ $knativeSourceVolume }}
          configMap:
            name: {{ $knativeRuntime.statusConfigMapName }}
            optional: true
            defaultMode: 0444
        - name: {{ $knativeMaterializedVolume }}
          emptyDir: {}
        {{- if .Values.serviceAccount.automountToken }}
        - name: {{ $knativeAppTokenVolume }}
          projected:
            defaultMode: 0444
            sources:
              - serviceAccountToken:
                  path: token
                  expirationSeconds: 3600
              - configMap:
                  name: kube-root-ca.crt
                  optional: true
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        apiVersion: v1
                        fieldPath: metadata.namespace
        {{- end }}
        {{- end }}
        {{- if $tsCa }}
        - name: falcone-transport-ca
          secret:
            secretName: {{ $ts.caSecretName }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
