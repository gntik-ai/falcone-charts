# The external-secrets operator dependency is vendored unpacked under charts/external-secrets/.
# Use that chart's own templated CRDs as the single source of truth so conversion webhook service
# names stay aligned with the operator/webhook resources rendered by the same dependency. A nested
# Chart.lock records the upstream chart provenance; the unpacked chart remains intentionally tracked.
external-secrets:
  # Install the bundled ESO controller and its cluster-scoped CRDs. Leave true for a
  # self-contained install. Set FALSE to install beside an External Secrets Operator the
  # cluster administrator already owns (issue #908): ESO CRDs are cluster-scoped and
  # singly-owned, so a second Helm release cannot adopt them and installing over them
  # fails with `invalid ownership metadata`.
  #
  # When false, the ClusterSecretStore and every ExternalSecret still render and are
  # reconciled by the existing controller — only the controller/webhook/certController
  # workloads and the CRDs are skipped. Point `eso.eso.namespace` (and the matching
  # `openbao.eso.namespace`) at the existing operator's namespace so the OpenBao
  # Kubernetes-auth ServiceAccount is created where that controller can use it.
  enabled: true
  installCRDs: true
  fullnameOverride: eso-external-secrets
  namespaceOverride: eso-system

eso:
  # NOTE: the `vault*` value-keys name ESO's provider TYPE (provider.vault), which OpenBao is
  # served by — they are NOT a HashiCorp Vault product reference. Only the VALUES point at OpenBao.
  vaultAddress: ""
  # Image for the post-install Job that waits for the external-secrets admission webhook to be ready
  # before the ClusterSecretStore/ExternalSecret hooks apply (avoids a "connection refused" race).
  webhookWait:
    image:
      repository: docker.io/alpine/k8s
      tag: "1.32.2"
      pullPolicy: IfNotPresent
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  vaultAuthPath: kubernetes
  vaultAuthRole: eso-role
  serviceAccountName: eso-openbao-auth
  refreshInterval: 1h
  tokenTTL: 24h
  namespace: eso-system
  clusterOwnership:
    adoptExisting: false
  caProvider:
    name: openbao-server-tls
    key: ca.crt
    namespace: secret-store
