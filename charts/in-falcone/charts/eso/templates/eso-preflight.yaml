{{- $es := index .Values "external-secrets" | default dict -}}
{{- /* Helm's default function treats false as empty; preserve an explicit false. */ -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
{{- $globalValues := .Values.global | default dict -}}
{{- $globalExternalSecrets := index $globalValues "externalSecrets" | default dict -}}
{{- $externalEsoNamespace := $globalExternalSecrets.operatorNamespace | default "" -}}
{{- $externalEsoServiceAccount := $globalExternalSecrets.operatorServiceAccount | default "" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-preflight
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eso-preflight
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["clustersecretstores"]
    verbs: ["get", "list"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["serviceaccounts"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eso-preflight
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: eso-preflight
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eso-preflight
---
apiVersion: batch/v1
kind: Job
metadata:
  name: eso-preflight
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-19"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/component: eso-preflight
    spec:
      restartPolicy: Never
      serviceAccountName: eso-preflight
      {{- include "eso.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- toYaml .Values.eso.podSecurityContext | nindent 8 }}
      containers:
        - name: preflight
          image: {{ include "eso.image" (dict "root" . "image" .Values.eso.webhookWait.image) | quote }}
          imagePullPolicy: {{ .Values.eso.webhookWait.image.pullPolicy }}
          securityContext: {{- toYaml .Values.eso.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              eso_managed={{ $esoManaged | quote }}
              release={{ .Release.Name | quote }}
              namespace={{ .Release.Namespace | quote }}
              eso_namespace={{ .Values.eso.namespace | quote }}
              external_eso_namespace={{ $externalEsoNamespace | quote }}
              external_eso_service_account={{ $externalEsoServiceAccount | quote }}
              # The supported external installation is the administrator-owned
              # `external-secrets` Helm release. Its controller Deployment uses the
              # configured controller ServiceAccount name.
              external_eso_deployment="$external_eso_service_account"
              external_eso_owner_release="external-secrets"
              external_eso_owner_namespace="external-secrets"
              openbao_namespace={{ .Values.eso.caProvider.namespace | default "secret-store" | quote }}
              reject_owner_conflict() {
                echo "$1; Falcone will not adopt or mutate the existing owner" >&2
                exit 1
              }
              if store_json="$(kubectl get clustersecretstore openbao-backend -o json 2>/dev/null)"; then
                if ! printf '%s' "$store_json" | jq -e \
                  --arg release "$release" \
                  --arg namespace "$namespace" \
                  --arg openbao_namespace "$openbao_namespace" '
                    .metadata.annotations["meta.helm.sh/release-name"] == $release
                    and .metadata.annotations["meta.helm.sh/release-namespace"] == $namespace
                    and .metadata.labels["app.kubernetes.io/instance"] == $release
                    and .metadata.labels["app.kubernetes.io/part-of"] == "in-falcone"
                    and ((.spec.provider.vault.server // "") | startswith("https://openbao." + $openbao_namespace + ".svc"))
                  ' >/dev/null; then
                  owner="$(printf '%s' "$store_json" | jq -r '.metadata.annotations["meta.helm.sh/release-name"] // "<missing>"')"
                  owner_ns="$(printf '%s' "$store_json" | jq -r '.metadata.annotations["meta.helm.sh/release-namespace"] // "<missing>"')"
                  reject_owner_conflict "ClusterSecretStore/openbao-backend is not owned by ${release}/${namespace} (found ${owner}/${owner_ns})"
                fi
              fi
              if [ "$eso_managed" = "false" ]; then
                if ! external_controller="$(kubectl -n "$external_eso_namespace" get deployment "$external_eso_deployment" -o json 2>/dev/null)"; then
                  reject_owner_conflict "configured External Secrets controller Deployment ${external_eso_namespace}/${external_eso_deployment} was not found"
                fi
                if ! external_service_account="$(kubectl -n "$external_eso_namespace" get serviceaccount "$external_eso_service_account" -o json 2>/dev/null)"; then
                  reject_owner_conflict "configured External Secrets controller ServiceAccount ${external_eso_namespace}/${external_eso_service_account} was not found"
                fi

                # Metadata-only ownership boundary: both exact objects must belong to
                # the canonical administrator Helm release. The Deployment must bind
                # the configured ServiceAccount, be available, and expose controller
                # labels consistently on its pod template. Any mismatch is rejected;
                # this Job never patches or adopts the administrator's objects.
                if ! printf '%s' "$external_controller" | jq -e \
                  --arg namespace "$external_eso_namespace" \
                  --arg deployment "$external_eso_deployment" \
                  --arg service_account "$external_eso_service_account" \
                  --arg owner_release "$external_eso_owner_release" \
                  --arg owner_namespace "$external_eso_owner_namespace" '
                    .metadata.namespace == $namespace
                    and .metadata.name == $deployment
                    and .metadata.annotations["meta.helm.sh/release-name"] == $owner_release
                    and .metadata.annotations["meta.helm.sh/release-namespace"] == $owner_namespace
                    and .metadata.labels["app.kubernetes.io/managed-by"] == "Helm"
                    and .metadata.labels["app.kubernetes.io/name"] == "external-secrets"
                    and .metadata.labels["app.kubernetes.io/instance"] == $owner_release
                    and .spec.template.spec.serviceAccountName == $service_account
                    and .spec.template.metadata.labels["app.kubernetes.io/name"] == .metadata.labels["app.kubernetes.io/name"]
                    and .spec.template.metadata.labels["app.kubernetes.io/instance"] == .metadata.labels["app.kubernetes.io/instance"]
                    and ((.status.availableReplicas // 0) >= 1)
                  ' >/dev/null; then
                  reject_owner_conflict "configured External Secrets controller Deployment ${external_eso_namespace}/${external_eso_deployment} has incompatible Helm ownership, controller labels, ServiceAccount binding, or readiness"
                fi
                if ! printf '%s' "$external_service_account" | jq -e \
                  --arg namespace "$external_eso_namespace" \
                  --arg service_account "$external_eso_service_account" \
                  --arg owner_release "$external_eso_owner_release" \
                  --arg owner_namespace "$external_eso_owner_namespace" '
                    .metadata.namespace == $namespace
                    and .metadata.name == $service_account
                    and .metadata.annotations["meta.helm.sh/release-name"] == $owner_release
                    and .metadata.annotations["meta.helm.sh/release-namespace"] == $owner_namespace
                    and .metadata.labels["app.kubernetes.io/managed-by"] == "Helm"
                    and .metadata.labels["app.kubernetes.io/name"] == "external-secrets"
                    and .metadata.labels["app.kubernetes.io/instance"] == $owner_release
                  ' >/dev/null; then
                  reject_owner_conflict "configured External Secrets controller ServiceAccount ${external_eso_namespace}/${external_eso_service_account} has incompatible Helm ownership or controller labels"
                fi
                api_resources="$(kubectl api-resources --api-group=external-secrets.io -o name)"
                for required_resource in clustersecretstores.external-secrets.io externalsecrets.external-secrets.io; do
                  if ! printf '%s\n' "$api_resources" | grep -qx "$required_resource"; then
                    echo "existing External Secrets installation is incompatible: missing ${required_resource}" >&2
                    exit 1
                  fi
                done
                echo "using available administrator-owned External Secrets controller ${external_eso_namespace}/${external_eso_deployment}"
              else
                deployments_json="$(kubectl get deploy -A -l app.kubernetes.io/name=external-secrets -o json)"
                conflict="$(printf '%s' "$deployments_json" \
                  | jq -r --arg release "$release" --arg namespace "$namespace" '
                    .items[]?
                    | select(
                        .metadata.annotations["meta.helm.sh/release-name"] != $release
                        or .metadata.annotations["meta.helm.sh/release-namespace"] != $namespace
                        or .metadata.labels["app.kubernetes.io/managed-by"] != "Helm"
                        or .metadata.labels["app.kubernetes.io/instance"] != $release
                      )
                    | "\(.metadata.namespace)/\(.metadata.name)"
                  ' | head -n1)"
                if [ -n "$conflict" ]; then
                  reject_owner_conflict "external-secrets controller is not owned by ${release}/${namespace}: ${conflict}"
                fi
              fi
              echo "ESO ownership preflight passed"
