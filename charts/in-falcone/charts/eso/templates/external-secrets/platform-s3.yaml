{{- /* repair-staging-infrastructure: emit post-install/upgrade hook annotations only in the
       bundled/managed ESO install (webhook-readiness ordering via eso-webhook-wait). In
       externally managed mode (issue #908) the ExternalSecrets are ordinary Helm-tracked
       resources so `helm uninstall` prunes them instead of orphaning untracked hook output.
       hasKey branch preserves an explicit `false`. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-s3-credentials
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-storage, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: s3_access_key
      remoteRef: { key: platform/s3, property: access-key }
    - secretKey: s3_secret_key
      remoteRef: { key: platform/s3, property: secret-key }
