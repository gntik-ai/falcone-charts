{{- /* repair-staging-infrastructure: emit post-install/upgrade hook annotations only in the
       bundled/managed ESO install (webhook-readiness ordering via eso-webhook-wait). In
       externally managed mode (issue #908) the ExternalSecrets are ordinary Helm-tracked
       resources so `helm uninstall` prunes them instead of orphaning untracked hook output.
       hasKey branch preserves an explicit `false`. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-documentdb-credentials
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-documentdb, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: POSTGRES_USER
      remoteRef: { key: platform/documentdb, property: username }
    - secretKey: POSTGRES_PASSWORD
      remoteRef: { key: platform/documentdb, property: password }
    - secretKey: POSTGRES_DB
      remoteRef: { key: platform/documentdb, property: database }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-ferretdb-credentials
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-ferretdb, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: postgresql-url
      remoteRef: { key: platform/documentdb, property: ferretdb-postgresql-url }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-documentdb-replication
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-documentdb-replication, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: password
      remoteRef: { key: platform/documentdb-replication, property: password }
    - secretKey: realtime-url
      remoteRef: { key: platform/documentdb-replication, property: realtime-url }
