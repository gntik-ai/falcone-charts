{{- /* repair-staging-infrastructure: emit post-install/upgrade hook annotations only in the
       bundled/managed ESO install (webhook-readiness ordering via eso-webhook-wait). In
       externally managed mode (issue #908) the ExternalSecrets are ordinary Helm-tracked
       resources so `helm uninstall` prunes them instead of orphaning untracked hook output.
       hasKey branch preserves an explicit `false`. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iam-keycloak-credentials
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-keycloak-admin, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: username
      remoteRef: { key: iam/keycloak, property: admin-username }
    - secretKey: password
      remoteRef: { key: iam/keycloak, property: admin-password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iam-identity-client
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-identity-client, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: client-id
      remoteRef: { key: iam/identity-client, property: client-id }
    - secretKey: client-secret
      remoteRef: { key: iam/identity-client, property: client-secret }
    - secretKey: KC_BOOTSTRAP_ADMIN_USERNAME
      remoteRef: { key: iam/keycloak, property: admin-username }
    - secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD
      remoteRef: { key: iam/keycloak, property: admin-password }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: iam-superadmin
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ $.Values.eso.refreshInterval | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target: { name: in-falcone-superadmin, creationPolicy: Merge, immutable: false }
  data:
    - secretKey: password
      remoteRef: { key: iam/superadmin, property: password }
