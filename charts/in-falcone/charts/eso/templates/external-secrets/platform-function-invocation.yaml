{{- /* #972: no signing material is generated by Helm or copied into values or
       ConfigMaps. #62: unlike the other ExternalSecrets (#908), this one is a
       post-install/post-upgrade hook (weight 5) in both managed and externally
       managed ESO modes. Its OpenBao record and the eso-role policy are written by
       openbao-function-invocation-seed (weight -2) on upgrades, which is itself a
       hook; as an ordinary resource it stays Degraded (403) under Argo CD, which
       never starts PostSync hooks, so the seed never ran. Trade-off: helm uninstall
       leaves this ExternalSecret behind; its target is Orphan/Retain either way. */ -}}
{{- $invocation := default (dict) .Values.global.functionInvocation -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-function-invocation
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
spec:
  refreshInterval: {{ .Values.eso.refreshInterval | default "1h" | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target:
    name: {{ $invocation.secretName | default "in-falcone-function-invocation" | quote }}
    # ESO creates the target without an ownerReference so replacing this hook on
    # upgrades cannot garbage-collect the signer Secret during a rollout.
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: false
  data:
    {{- range $property := list "private-key" "key-id" "jwks" }}
    - secretKey: {{ $property | quote }}
      remoteRef:
        key: {{ $invocation.remoteKey | default "control-plane/function-invocation" | quote }}
        property: {{ $property | quote }}
    {{- end }}
