{{- /* #972: follow the existing managed/adopted ESO lifecycle. No signing
       material is generated by Helm or copied into values or ConfigMaps. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
{{- $invocation := default (dict) .Values.global.functionInvocation -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: platform-function-invocation
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ .Values.eso.refreshInterval | default "1h" | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target:
    name: {{ $invocation.secretName | default "in-falcone-function-invocation" | quote }}
    # This is a new ESO-owned Secret; Merge would require a pre-existing target.
    creationPolicy: Owner
    deletionPolicy: Retain
    immutable: false
  data:
    {{- range $property := list "private-key" "key-id" "jwks" }}
    - secretKey: {{ $property | quote }}
      remoteRef:
        key: {{ $invocation.remoteKey | default "platform/functions/invocation" | quote }}
        property: {{ $property | quote }}
    {{- end }}
