{{- /* OpenBao is the sole source of execution-token signing material. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
{{- $flow := .Values.global.flowExecutionToken | default dict -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flows-execution-token
  namespace: {{ .Release.Namespace }}
  {{- if $esoManaged }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
  {{- end }}
spec:
  refreshInterval: {{ .Values.eso.refreshInterval | default "1h" | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target:
    name: {{ dig "secretName" "in-falcone-flow-execution-token" $flow | quote }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: false
  data:
    - secretKey: FLOW_EXECUTION_TOKEN_SECRET
      remoteRef:
        key: {{ dig "remoteKey" "flows/execution-token-secret" $flow | quote }}
        property: secret
