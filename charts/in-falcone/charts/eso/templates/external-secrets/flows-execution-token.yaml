{{- /* OpenBao is the sole source of execution-token signing material.
       #70, following #62: both ESO modes use post hooks after OpenBao policy
       publication and eso-role attachment, before the readiness gate. An ordinary
       resource can fail Argo CD Sync on a missing policy (403), preventing the
       PostSync policy hooks from running. Trade-off: helm uninstall leaves this
       ExternalSecret behind; its target is Orphan/Retain either way. */ -}}
{{- $flow := .Values.global.flowExecutionToken | default dict -}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: flows-execution-token
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
spec:
  refreshInterval: {{ .Values.eso.refreshInterval | default "1h" | quote }}
  secretStoreRef: { name: openbao-backend, kind: ClusterSecretStore }
  target:
    name: {{ dig "secretName" "in-falcone-flow-execution-token" $flow | quote }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    immutable: false
  data:
    - secretKey: FLOW_EXECUTION_TOKEN_SECRET
      remoteRef:
        key: {{ dig "remoteKey" "flows/execution-token-secret" $flow | quote }}
        property: secret
