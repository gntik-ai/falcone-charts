{{- $managed := true -}}
{{- if hasKey (index .Values "external-secrets") "enabled" -}}
  {{- $managed = (index .Values "external-secrets").enabled -}}
{{- end -}}
{{- $external := .Values.global.externalSecrets | default dict -}}
{{- $controllerNamespace := ternary (.Values.eso.namespace | default "eso-system") ($external.operatorNamespace | default "") $managed -}}
{{- $controllerServiceAccount := ternary "eso-external-secrets" ($external.operatorServiceAccount | default "") $managed -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: eso-openbao-token-request
  namespace: {{ .Values.eso.namespace | default "eso-system" }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames:
      - {{ .Values.eso.serviceAccountName | default "eso-openbao-auth" }}
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: eso-openbao-token-request
  namespace: {{ .Values.eso.namespace | default "eso-system" }}
subjects:
  - kind: ServiceAccount
    name: {{ $controllerServiceAccount }}
    namespace: {{ $controllerNamespace }}
  # The metadata-only reconcile hook requests the same bounded canary token.
  - kind: ServiceAccount
    name: openbao
    namespace: {{ .Values.eso.caProvider.namespace | default "secret-store" }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: eso-openbao-token-request
