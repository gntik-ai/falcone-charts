{{- /* Gate only ESO status. This identity cannot read Kubernetes Secret values. */ -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flows-execution-token-ready
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flows-execution-token-ready
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    resourceNames: ["flows-execution-token"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flows-execution-token-ready
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flows-execution-token-ready
subjects:
  - kind: ServiceAccount
    name: flows-execution-token-ready
    namespace: {{ .Release.Namespace }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flows-execution-token-ready
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/component: flows-execution-token-ready
    spec:
      restartPolicy: Never
      serviceAccountName: flows-execution-token-ready
      {{- include "eso.imagePullSecrets" . | nindent 6 }}
      securityContext: {{- toYaml .Values.eso.podSecurityContext | nindent 8 }}
      containers:
        - name: wait
          image: {{ include "eso.image" (dict "root" . "image" .Values.eso.webhookWait.image) | quote }}
          imagePullPolicy: {{ .Values.eso.webhookWait.image.pullPolicy }}
          securityContext: {{- toYaml .Values.eso.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              kubectl --cache-dir=/tmp/kubectl-cache -n {{ .Release.Namespace | quote }} wait --for=condition=Ready externalsecret.external-secrets.io/flows-execution-token --timeout=240s
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
