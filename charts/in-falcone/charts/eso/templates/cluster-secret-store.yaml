{{- /* repair-staging-infrastructure: hook lifecycle depends on ESO ownership. In the
       self-contained managed install the bundled controller/webhook are still starting,
       so the store/ExternalSecret CRs apply as post-install/upgrade hooks gated by the
       webhook-wait hook. In externally managed mode (issue #908) the administrator's
       controller is already serving, so these become ordinary Helm-tracked resources
       (no hook annotations) — they are the ONLY Falcone-owned integration objects and
       must be pruned by `helm uninstall` instead of orphaned as untracked hook output.
       `.enabled | default true` is wrong: Helm's `default` treats an explicit false as
       empty, so branch on hasKey like eso-webhook-wait/eso-preflight. */ -}}
{{- $es := index .Values "external-secrets" | default dict -}}
{{- $esoManaged := true -}}
{{- if hasKey $es "enabled" }}{{- $esoManaged = $es.enabled }}{{- end -}}
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
{{ $openbaoNamespace := .Values.eso.caProvider.namespace | default "secret-store" }}
{{ $vaultAddress := .Values.eso.vaultAddress | default (printf "https://openbao.%s.svc.cluster.local:8200" $openbaoNamespace) }}
metadata:
  # OpenBao-backed store. The provider TYPE stays `vault` — ESO's Vault provider is the
  # OpenBao-compatible client (KV v2 over the same REST surface); only the target points at OpenBao.
  name: openbao-backend
  labels:
    app.kubernetes.io/name: external-secrets
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: in-falcone
    in-falcone.io/component: eso
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    {{- if $esoManaged }}
    # Managed mode only: apply the CRs as a post-install/upgrade hook so the bundled operator + its
    # admission webhook are running before the ClusterSecretStore/ExternalSecret instances are
    # validated (the CRDs themselves are in this subchart's crds/ dir, installed first). Store =
    # weight 0, ExternalSecrets = weight 5. In externally managed mode these annotations are omitted
    # so the resource is a normal Helm-tracked object, cleaned up on uninstall.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    {{- end }}
spec:
  provider:
    vault:
      server: {{ $vaultAddress | quote }}
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: {{ .Values.eso.caProvider.name }}
        key: {{ .Values.eso.caProvider.key }}
        namespace: {{ .Values.eso.caProvider.namespace }}
      auth:
        kubernetes:
          mountPath: {{ .Values.eso.vaultAuthPath | quote }}
          role: {{ .Values.eso.vaultAuthRole | quote }}
          serviceAccountRef:
            name: {{ .Values.eso.serviceAccountName }}
            namespace: {{ .Values.eso.namespace }}
