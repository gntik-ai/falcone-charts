{{- $root := . -}}
{{- $t := .Values.temporal -}}
{{- $p := $t.persistence -}}
{{- $podSecurity := deepCopy (default (dict) $t.podSecurityContext) -}}
{{- $containerSecurity := deepCopy (default (dict) $t.securityContext) -}}
{{- $_ := unset $containerSecurity "fsGroup" -}}
{{- if $root.Values.global.podSecurity.openshiftRestricted }}{{- $_ := unset $podSecurity "runAsUser" }}{{- $_ := unset $podSecurity "runAsGroup" }}{{- $_ := unset $podSecurity "fsGroup" }}{{- $_ := unset $containerSecurity "runAsUser" }}{{- $_ := unset $containerSecurity "runAsGroup" }}{{- end }}
{{- /*
  Schema setup/upgrade Job. On fresh install this is a normal Job because PostgreSQL is created by
  the same release; its connectivity loop waits until the DB bootstrap creates the role/databases.
  On upgrades, where PostgreSQL already exists, it runs before workload rollout.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "in-falcone.temporal.fullname" $root }}-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.temporal.roleLabels" (dict "root" $root "role" "schema") | nindent 4 }}
  {{- if .Release.IsUpgrade }}
  annotations:
    helm.sh/hook: pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
  {{- end }}
spec:
  backoffLimit: {{ $t.jobs.backoffLimit }}
  activeDeadlineSeconds: {{ $t.jobs.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ $t.jobs.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "in-falcone.temporal.roleLabels" (dict "root" $root "role" "schema") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      {{- include "in-falcone.temporal.imagePullSecrets" $root | nindent 6 }}
      {{- with $podSecurity }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: temporal-sql-tool
          image: {{ include "in-falcone.temporal.image" (dict "root" $root "image" $t.schemaTool.image) | quote }}
          imagePullPolicy: {{ $t.schemaTool.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            {{- toYaml $containerSecurity | nindent 12 }}
          command:
            - /bin/sh
            - -ec
            - |
              # NOTE: the admin-tools image is alpine-based and ships /bin/sh ONLY (no
              # bash). Keep this script POSIX-sh compatible (no arrays, no PIPESTATUS).
              SQL="temporal-sql-tool --ep ${SQL_HOST} --port ${SQL_PORT} --user ${SQL_USER} --password ${SQL_PASSWORD} --plugin ${SQL_PLUGIN}"

              # Wait for PostgreSQL to accept connections before touching schemas.
              # temporal-sql-tool has no `ping`; `create-database` against the default
              # `postgres` DB doubles as a connectivity probe (idempotent + exit 0 when
              # PG is reachable, whether or not the database already exists).
              i=0
              while [ "$i" -lt 60 ]; do
                if ${SQL} --database postgres create-database >/dev/null 2>&1; then
                  echo "postgres ${SQL_HOST}:${SQL_PORT} reachable"; break
                fi
                i=$((i + 1))
                echo "waiting for postgres ${SQL_HOST}:${SQL_PORT} (${i}/60)"; sleep 5
              done

              update_temporal_schema() {
                db="$1"
                dir="$2"
                # Whether the schema must be CREATED or UPGRADED is a property of the
                # DATABASE, not of the Helm release. Branching on .Release.IsUpgrade was
                # wrong: adding Temporal to an existing release — exactly what happens when
                # a deployment adopts a chart where Temporal became core — is a Helm upgrade
                # whose Temporal databases are brand new and empty. That took the upgrade
                # path and failed with:
                #
                #   Unable to update SQL schema. error reading current schema version:
                #   pq: relation "schema_version" does not exist
                #
                # Probe the database instead. `setup-schema` is the operation that creates
                # schema_version, so its absence is the exact, authoritative signal.
                ${SQL} --database "${db}" create-database
                if ${SQL} --database "${db}" update-schema -d "${dir}" 2>/tmp/schema-err; then
                  echo "upgraded existing Temporal schema in ${db}"
                  return 0
                fi
                # Match quote-agnostically: temporal-sql-tool emits the driver error inside a
                # JSON log field, so the quotes around the relation name arrive backslash-escaped
                # (relation \"schema_version\" does not exist).
                if grep -q 'schema_version' /tmp/schema-err && grep -q 'does not exist' /tmp/schema-err; then
                  echo "no schema_version in ${db} — initialising Temporal schema"
                  ${SQL} --database "${db}" setup-schema -v 0.0
                  ${SQL} --database "${db}" update-schema -d "${dir}"
                  return 0
                fi
                echo "failed to update Temporal schema in ${db}:" >&2
                cat /tmp/schema-err >&2
                return 1
              }

              # Primary persistence database + schema.
              update_temporal_schema "${SQL_DATABASE}" /etc/temporal/schema/postgresql/v12/temporal/versioned

              # SQL visibility database + schema (no Elasticsearch).
              update_temporal_schema "${SQL_VISIBILITY_DATABASE}" /etc/temporal/schema/postgresql/v12/visibility/versioned
          env:
            - name: SQL_PLUGIN
              value: {{ $p.driver | quote }}
            - name: SQL_HOST
              value: {{ tpl $p.host $root | quote }}
            - name: SQL_PORT
              value: {{ $p.port | quote }}
            - name: SQL_USER
              value: {{ $p.user | quote }}
            - name: SQL_PASSWORD
              {{- if $p.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ $p.existingSecret | quote }}
                  key: {{ $p.passwordSecretKey | quote }}
              {{- else }}
              value: {{ $p.password | quote }}
              {{- end }}
            - name: SQL_DATABASE
              value: {{ $p.database | quote }}
            - name: SQL_VISIBILITY_DATABASE
              value: {{ $p.visibilityDatabase | quote }}
          {{- with $t.jobs.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
