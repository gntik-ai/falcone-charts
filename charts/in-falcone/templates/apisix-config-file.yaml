{{- /*
  APISIX standalone-mode config.yaml override (falcone#986).

  The APISIX Docker entrypoint rewrites /usr/local/apisix/conf/config.yaml in
  place when APISIX_STAND_ALONE=true (set -eo pipefail), so the override cannot
  be mounted read-only from a ConfigMap directly. This ConfigMap holds the
  canonical content; an init container copies it into a writable emptyDir that
  is then mounted over the config.yaml path (see values/staging.yaml).

  The only functional delta from the stock standalone config is
  plugin_attr.prometheus.enable_export_server=false. APISIX 3.10 defaults that
  to true, which makes the Prometheus plugin register NO public-api handler, so
  the /apisix/prometheus/metrics route (1011-metrics in apisix.yaml) returns a
  clean 404 and the Prometheus scrape target is permanently DOWN. Disabling the
  dedicated export server lets the public-api plugin serve the metrics on the
  gateway port that Falcone actually scrapes.
*/ -}}
{{- if .Values.apisix.initContainers }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-apisix-config-file
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    in-falcone.io/component: apisix
data:
  config.yaml: |
    deployment:
      role: data_plane
      role_data_plane:
        config_provider: yaml
      admin:
        admin_key:
          - name: admin
            key: ''
            role: admin
    apisix:
      extra_lua_path: /usr/local/apisix/falcone/?.lua
    # Explicitly retain the APISIX 3.10 built-ins when enabling the custom
    # plugin; setting plugins replaces the stock list rather than extending it.
    plugins:
      - real-ip
      - ai
      - client-control
      - proxy-control
      - request-id
      - zipkin
      - ext-plugin-pre-req
      - fault-injection
      - mocking
      - serverless-pre-function
      - cors
      - issuer-jwks-auth
      - ip-restriction
      - ua-restriction
      - referer-restriction
      - csrf
      - uri-blocker
      - request-validation
      - chaitin-waf
      - openid-connect
      - cas-auth
      - authz-casbin
      - authz-casdoor
      - wolf-rbac
      - ldap-auth
      - hmac-auth
      - basic-auth
      - jwt-auth
      - key-auth
      - consumer-restriction
      - forward-auth
      - opa
      - authz-keycloak
      - proxy-cache
      - body-transformer
      - proxy-mirror
      - proxy-rewrite
      - workflow
      - api-breaker
      - limit-conn
      - limit-count
      - limit-req
      - gzip
      - traffic-split
      - redirect
      - response-rewrite
      - degraphql
      - kafka-proxy
      - grpc-transcode
      - grpc-web
      - public-api
      - prometheus
      - datadog
      - loki-logger
      - elasticsearch-logger
      - echo
      - loggly
      - http-logger
      - splunk-hec-logging
      - skywalking-logger
      - google-cloud-logging
      - sls-logger
      - tcp-logger
      - kafka-logger
      - rocketmq-logger
      - syslog
      - udp-logger
      - file-logger
      - clickhouse-logger
      - tencent-cloud-cls
      - inspect
      - example-plugin
      - aws-lambda
      - azure-functions
      - openwhisk
      - openfunction
      - serverless-post-function
      - ext-plugin-post-req
      - ext-plugin-post-resp
    plugin_attr:
      prometheus:
        enable_export_server: false
{{- end }}
