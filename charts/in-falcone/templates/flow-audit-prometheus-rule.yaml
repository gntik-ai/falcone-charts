{{- $audit := .Values.flowAudit | default dict -}}
{{- $alerts := get $audit "alerts" | default dict -}}
{{- $enabled := true -}}
{{- if hasKey $alerts "enabled" -}}{{- $enabled = get $alerts "enabled" -}}{{- end -}}
{{- if $enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ printf "%s-flow-audit" (include "in-falcone.fullname" .) | trunc 63 | trimSuffix "-" }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    in-falcone.io/component: flow-audit-alerts
spec:
  groups:
    - name: flow-audit
      rules:
        - alert: FalconeFlowAuditBacklog
          expr: {{ printf "falcone_flow_audit_outbox_rows{state=\"pending\"} > %v" (get $alerts "pendingRows" | default 100) | quote }}
          for: 10m
          labels: {severity: warning}
          annotations:
            summary: Flow audit outbox backlog is growing
        - alert: FalconeFlowAuditFailed
          expr: 'falcone_flow_audit_outbox_rows{state="failed"} > 0'
          for: 5m
          labels: {severity: critical}
          annotations:
            summary: Flow audit outbox has exhausted deliveries
        - alert: FalconeFlowAuditRelayStale
          expr: {{ printf "time() - falcone_flow_audit_relay_last_success_timestamp_seconds > %v" (get $alerts "relayStaleSeconds" | default 300) | quote }}
          for: 5m
          labels: {severity: warning}
          annotations:
            summary: Flow audit relay has not completed a successful tick
{{- end }}
