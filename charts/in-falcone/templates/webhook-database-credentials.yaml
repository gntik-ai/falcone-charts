{{- $database := .Values.global.webhookDatabase -}}
{{- $credentials := $database.credentials -}}
{{- $principals := $database.principals -}}
{{- $name := printf "%s-webhook-db-credential" (include "in-falcone.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $markerName := printf "%s-initialized" $credentials.secretName | trunc 253 | trimSuffix "-" -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $credentials.secretName -}}
{{- $marker := lookup "v1" "ConfigMap" .Release.Namespace $markerName -}}
{{- $initializationPhase := and $credentials.create (or .Release.IsInstall (and .Release.IsUpgrade $database.migration.firstHandoff)) -}}
{{- $canCreateSecret := and $initializationPhase (empty $existing) (empty $marker) -}}
{{- $canCreateMarker := and $initializationPhase (empty $marker) -}}
{{- $containerSecurityContext := deepCopy (default (dict) .Values.bootstrap.job.securityContext) -}}
{{- if (.Values.global.podSecurity.openshiftRestricted | default false) -}}
  {{- $_ := unset $containerSecurityContext "runAsUser" -}}
  {{- $_ := unset $containerSecurityContext "runAsGroup" -}}
{{- end -}}
{{- $podSecurityContext := deepCopy (default (dict) .Values.global.podSecurity) -}}
{{- if (.Values.global.podSecurity.openshiftRestricted | default false) -}}
  {{- $_ := unset $podSecurityContext "runAsUser" -}}
  {{- $_ := unset $podSecurityContext "runAsGroup" -}}
  {{- $_ := unset $podSecurityContext "fsGroup" -}}
  {{- $_ := unset $podSecurityContext "fsGroupChangePolicy" -}}
  {{- $_ := unset $podSecurityContext "openshiftRestricted" -}}
{{- end -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-database-credential
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-44"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-database-credential
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-44"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ $credentials.secretName | quote }}]
    verbs: ["get"]
  {{- if $credentials.create }}
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $markerName | quote }}]
    verbs: ["get"]
  {{- end }}
  {{- if $canCreateSecret }}
  # Create cannot be restricted by resourceName because the target is absent.
  # It is granted only to a fresh managed install or the explicit,
  # backup-gated first legacy handoff while both retained objects are absent.
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  {{- end }}
  {{- if $canCreateMarker }}
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-database-credential
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-44"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-database-credential
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-44"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
data:
  credential-bootstrap.sh: |
{{ .Files.Get "files/webhook-database-credential-bootstrap.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook-database-credential
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-43"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "in-falcone.labels" . | nindent 8 }}
        app.kubernetes.io/component: webhook-database-credential
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $name }}
      automountServiceAccountToken: true
      enableServiceLinks: false
      {{- include "in-falcone.imagePullSecrets" . | nindent 6 }}
      securityContext:
        {{- toYaml $podSecurityContext | nindent 8 }}
      containers:
        - name: credential
          image: "{{ include "component-wrapper.normalizeRepository" (dict "Values" .Values "repository" .Values.bootstrap.job.image.repository) }}:{{ .Values.bootstrap.job.image.tag }}"
          imagePullPolicy: {{ .Values.bootstrap.job.image.pullPolicy }}
          command: ["/bin/sh", "/scripts/credential-bootstrap.sh"]
          env:
            - name: RELEASE_NAMESPACE
              value: {{ .Release.Namespace | quote }}
            - name: RELEASE_NAME
              value: {{ .Release.Name | quote }}
            - name: CHART_LABEL
              value: {{ printf "%s-%s" .Chart.Name .Chart.Version | quote }}
            - name: APP_NAME
              value: {{ include "in-falcone.name" . | quote }}
            - name: MANAGED_BY
              value: {{ .Release.Service | quote }}
            - name: WEBHOOK_DATABASE_CREDENTIAL_SECRET
              value: {{ $credentials.secretName | quote }}
            - name: WEBHOOK_DATABASE_CREDENTIAL_MARKER
              value: {{ $markerName | quote }}
            - name: WEBHOOK_DATABASE_CREDENTIAL_CREATE
              value: {{ ternary "true" "false" $credentials.create | quote }}
            - name: WEBHOOK_DATABASE_IS_UPGRADE
              value: {{ ternary "true" "false" .Release.IsUpgrade | quote }}
            - name: WEBHOOK_DATABASE_FIRST_HANDOFF
              value: {{ ternary "true" "false" $database.migration.firstHandoff | quote }}
            - name: WEBHOOK_DATABASE_SECRET_CREATE_AUTHORIZED
              value: {{ ternary "true" "false" $canCreateSecret | quote }}
            - name: WEBHOOK_DATABASE_MARKER_CREATE_AUTHORIZED
              value: {{ ternary "true" "false" $canCreateMarker | quote }}
            - name: WEBHOOK_DATABASE_CREDENTIAL_LOOKUP_FOUND
              value: {{ ternary "true" "false" (not (empty $existing)) | quote }}
            - name: WEBHOOK_DATABASE_MARKER_LOOKUP_FOUND
              value: {{ ternary "true" "false" (not (empty $marker)) | quote }}
            - name: WEBHOOK_DATABASE_HOST
              value: {{ tpl $database.connection.host . | quote }}
            - name: WEBHOOK_DATABASE_PORT
              value: {{ $database.connection.port | quote }}
            - name: WEBHOOK_DATABASE_NAME
              value: {{ $database.connection.database | quote }}
            - name: WEBHOOK_SCHEMA_DATABASE_ROLE
              value: {{ $principals.schema | quote }}
            - name: WEBHOOK_RUNTIME_DATABASE_ROLE
              value: {{ $principals.runtime | quote }}
            - name: WEBHOOK_KEY_WRITE_DATABASE_ROLE
              value: {{ $principals.writer | quote }}
            - name: WEBHOOK_KEY_LIFECYCLE_DATABASE_ROLE
              value: {{ $principals.lifecycle | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          securityContext:
            {{- toYaml $containerSecurityContext | nindent 12 }}
          resources:
            {{- toYaml $database.resources | nindent 12 }}
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
            defaultMode: 0555
        # The credential script creates eight mode-0400 files and removes them
        # before exit. Keep that scratch space bounded and isolated from the
        # read-only container root.
        - name: tmp
          emptyDir:
            sizeLimit: 1Mi
