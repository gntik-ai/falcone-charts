{{- /* Reconcile the platform Flow audit topic after the broker exists. */ -}}
{{- $transportSecurity := default (dict) .Values.global.transportSecurity -}}
{{- $transportOn := $transportSecurity.enabled | default false -}}
{{- $kafkaTransportEnv := list -}}
{{- if $transportOn -}}
  {{- range ($transportSecurity.env | default (list)) -}}
    {{- if has (.name | default "") (list "KAFKA_SSL" "KAFKA_SSL_CA_FILE") -}}
      {{- $kafkaTransportEnv = append $kafkaTransportEnv . -}}
    {{- end -}}
  {{- end -}}
{{- end -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ printf "%s-flow-audit-topic" .Release.Name | trunc 63 | trimSuffix "-" }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "in-falcone.labels" . | nindent 4 }}
    app.kubernetes.io/component: flow-audit-topic
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        {{- include "in-falcone.labels" . | nindent 8 }}
        app.kubernetes.io/component: flow-audit-topic
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1001
      {{- include "in-falcone.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: topic-reconcile
          image: {{ include "component-wrapper.renderImage" (dict "Values" .Values "image" .Values.kafka.image "name" "Kafka topic provisioner") | quote }}
          imagePullPolicy: {{ .Values.kafka.image.pullPolicy | default "IfNotPresent" }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          command:
            - /bin/sh
            - -ec
            - |
              topics=/opt/bitnami/kafka/bin/kafka-topics.sh
              client_config=/tmp/flow-audit-client.properties
              if [ "${KAFKA_SSL:-false}" = true ]; then
                if [ -z "${KAFKA_SSL_CA_FILE:-}" ] || [ ! -f "$KAFKA_SSL_CA_FILE" ]; then
                  echo "Flow audit topic TLS CA is unavailable" >&2
                  exit 1
                fi
                printf 'security.protocol=SSL\nssl.truststore.type=PEM\nssl.truststore.location=%s\n' \
                  "$KAFKA_SSL_CA_FILE" >"$client_config"
              else
                printf 'security.protocol=PLAINTEXT\n' >"$client_config"
              fi
              describe_error=/tmp/flow-audit-describe.stderr
              create_error=/tmp/flow-audit-create.stderr
              attempt=0
              while [ "$attempt" -lt 60 ]; do
                if "$topics" --bootstrap-server "$KAFKA_BROKERS" --command-config "$client_config" --describe --topic "$FLOW_AUDIT_TOPIC" >/dev/null 2>"$describe_error"; then
                  echo "Flow audit topic is ready"
                  exit 0
                fi
                "$topics" --bootstrap-server "$KAFKA_BROKERS" --command-config "$client_config" --create --if-not-exists \
                  --topic "$FLOW_AUDIT_TOPIC" --partitions 1 --replication-factor 1 >/dev/null 2>"$create_error" || :
                if "$topics" --bootstrap-server "$KAFKA_BROKERS" --command-config "$client_config" --describe --topic "$FLOW_AUDIT_TOPIC" >/dev/null 2>"$describe_error"; then
                  echo "Flow audit topic is ready"
                  exit 0
                fi
                attempt=$((attempt + 1))
                sleep 5
              done
              failure_class=unknown
              if grep -Eqi 'AuthorizationException|not authorized' "$describe_error" "$create_error"; then
                failure_class=authorization
              elif grep -Eqi 'AuthenticationException|SSLHandshakeException|SaslAuthenticationException' "$describe_error" "$create_error"; then
                failure_class=authentication
              elif grep -Eqi 'TimeoutException|timed out|Connection refused' "$describe_error" "$create_error"; then
                failure_class=connectivity
              elif grep -Eqi 'UnknownTopicOrPartitionException|does not exist' "$describe_error" "$create_error"; then
                failure_class=topic_unavailable
              fi
              echo "Flow audit topic could not be verified: class=$failure_class attempts=$attempt" >&2
              exit 1
          env:
            - name: KAFKA_BROKERS
              value: {{ printf "%s:%v" (include "in-falcone.componentServiceNameByAlias" (dict "root" . "component" "kafka")) .Values.kafka.service.port | quote }}
            - name: FLOW_AUDIT_TOPIC
              value: {{ .Values.global.flowAuditTopic | quote }}
            - name: KAFKA_HEAP_OPTS
              value: -Xmx256M
            {{- with $kafkaTransportEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: kafka-logs
              mountPath: /opt/bitnami/kafka/logs
            {{- if $transportOn }}
            - name: transport-ca
              mountPath: {{ $transportSecurity.caMountPath | default "/etc/falcone/tls" }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: kafka-logs
          emptyDir: {}
        {{- if $transportOn }}
        - name: transport-ca
          secret:
            secretName: {{ $transportSecurity.caSecretName }}
        {{- end }}
