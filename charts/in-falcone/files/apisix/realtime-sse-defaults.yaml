# Standalone SSE defaults are independent of the operator bootstrap route list.
# The bootstrap payload renderer applies the active gateway policy and namespace.
routes:
- routeId: public-api-realtime-collection-changes
  name: public-api-realtime-collection-changes
  uri: /v1/realtime/workspaces/*
  methods:
  - GET
  - OPTIONS
  priority: 340
  vars:
  - - uri
    - ~~
    - ^/v1/realtime/workspaces/[^/]+/data/[^/]+/collections/[^/]+/changes$
  authMode: query_api_key_sse
  accessLog:
    omitQueryString: true
    redactQueryParameters:
    - apikey
    format: '{"method":"$request_method","path":"$uri","status":$status}'
  plugins:
    cors:
      allow_methods: GET,OPTIONS
    limit-count:
      count: 120
      time_window: 60
      rejected_code: 429
      key_type: var_combination
      key: $http_apikey$arg_apikey
      allow_degradation: false
    client-control:
      max_body_size: 1024
    request-validation:
      header_schema:
        type: object
    proxy-rewrite:
      headers:
        set: &id001
          x-auth-subject: ''
          x-actor-username: ''
          x-tenant-id: ''
          x-workspace-id: ''
          x-plan-id: ''
          x-auth-scopes: ''
          x-actor-roles: ''
          x-gateway-auth: ${{GATEWAY_SHARED_SECRET}}
  labels:
    gateway.in-falcone.io/route-kind: product_api_apikey
    gateway.in-falcone.io/family: realtime
    gateway.in-falcone.io/auth-mode: query_api_key_sse
    gateway.in-falcone.io/tenant-binding: api-key
    gateway.in-falcone.io/workspace-binding: api-key
    gateway.in-falcone.io/plan-capabilities: ''
    gateway.in-falcone.io/audit-required: 'false'
  upstream:
    component: controlPlane
    port: 8080
    dataPlane: true
    requiresExecutor: true
    sse: true
- routeId: public-api-realtime-table-changes
  name: public-api-realtime-table-changes
  uri: /v1/realtime/workspaces/*
  methods:
  - GET
  - OPTIONS
  priority: 340
  vars:
  - - uri
    - ~~
    - ^/v1/realtime/workspaces/[^/]+/data/[^/]+/schemas/[^/]+/tables/[^/]+/changes$
  authMode: query_api_key_sse
  accessLog:
    omitQueryString: true
    redactQueryParameters:
    - apikey
    format: '{"method":"$request_method","path":"$uri","status":$status}'
  plugins:
    cors:
      allow_methods: GET,OPTIONS
    limit-count:
      count: 120
      time_window: 60
      rejected_code: 429
      key_type: var_combination
      key: $http_apikey$arg_apikey
      allow_degradation: false
    client-control:
      max_body_size: 1024
    request-validation:
      header_schema:
        type: object
    proxy-rewrite:
      headers:
        set: *id001
  labels:
    gateway.in-falcone.io/route-kind: product_api_apikey
    gateway.in-falcone.io/family: realtime
    gateway.in-falcone.io/auth-mode: query_api_key_sse
    gateway.in-falcone.io/tenant-binding: api-key
    gateway.in-falcone.io/workspace-binding: api-key
    gateway.in-falcone.io/plan-capabilities: ''
    gateway.in-falcone.io/audit-required: 'false'
  upstream:
    component: controlPlane
    port: 8080
    dataPlane: true
    requiresExecutor: true
    sse: true
