global:
  podSecurity:
    # Propagate restricted-v2 arbitrary-UID behavior into dependency charts.
    # The component wrapper uses this flag to remove fixed runAsUser/runAsGroup
    # values from init containers while retaining runAsNonRoot and hardening.
    openshiftRestricted: true

platform:
  target: openshift
  network:
    exposureKind: Route
  securityProfile: restricted-v2
  openshift:
    enabled: true
  routeAnnotations:
    haproxy.router.openshift.io/timeout: 30s

publicSurface:
  route:
    annotations:
      haproxy.router.openshift.io/timeout: 30s

apisix:
  podSecurityContext: {}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    capabilities:
      drop:
        - ALL

controlPlane:
  podSecurityContext: {}

webConsole:
  podSecurityContext: {}
