# Argo CD-managed staging image pins (gntik-ai/falcone#1027, falcone-charts#46/#47).
#
# The falcone-staging Argo CD Application renders values/staging.yaml, then
# values/staging-cluster.yaml, then this file. First-party images are pinned by the
# immutable sha-<commit> tags that release-images publishes for every gntik-ai/falcone
# commit (gntik-ai/falcone#1026). argocd-image-updater writes each new sha- tag here and
# Hermes triggers the sync after its environment health gate.
#
# staging.yaml keeps its historical digest pins for the revision-20..24 repair contracts.
# A digest wins over the tag in component-wrapper.renderImage, so `digest: ""` clears them
# for the Argo-managed render. Do not hand-pin digests here.
controlPlane:
  image:
    tag: sha-fecb3a0
    digest: ""
    repository: ghcr.io/gntik-ai/in-falcone-control-plane
  functionExecutor:
    runtimeImage:
      tag: sha-fecb3a0
      digest: ""
      repository: ghcr.io/gntik-ai/in-falcone-fn-runtime
controlPlaneExecutor:
  image:
    tag: sha-fecb3a0
    digest: ""
    repository: ghcr.io/gntik-ai/in-falcone-control-plane-executor
webConsole:
  image:
    tag: sha-867bfad
    digest: ""
    repository: ghcr.io/gntik-ai/in-falcone-web-console
workflowWorker:
  image:
    tag: sha-fecb3a0
    digest: ""
    repository: ghcr.io/gntik-ai/in-falcone-workflow-worker
mcp:
  runtimeImage:
    tag: sha-fecb3a0
    digest: ""
    repository: ghcr.io/gntik-ai/in-falcone-mcp-runtime
