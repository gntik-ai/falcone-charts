global:
  namespace: in-falcone-staging
  environment: staging
  # repair-staging-infrastructure-20260809: consume the administrator-owned External
  # Secrets Operator (issue #908 "externally managed ESO" mode). Falcone renders NO
  # object into this namespace and never adopts or mutates its resources; it owns only
  # its ClusterSecretStore, fourteen ExternalSecrets and the eso-system auth identity.
  # operatorServiceAccount names the external controller identity that is granted the
  # least-privilege TokenRequest Role for eso-system/eso-openbao-auth.
  externalSecrets:
    operatorNamespace: external-secrets
    operatorServiceAccount: external-secrets
publicSurface:
  hostnames:
    api: api.staging.in-falcone.example.com
    console: console.staging.in-falcone.example.com
    identity: iam.staging.in-falcone.example.com
    realtime: realtime.staging.in-falcone.example.com
  certificates:
    wildcardSecretName: in-falcone-staging-wildcard-tls
    surfaces:
      api: in-falcone-staging-api-tls
      console: in-falcone-staging-console-tls
      identity: in-falcone-staging-identity-tls
      realtime: in-falcone-staging-realtime-tls
environmentProfile:
  id: staging
  diagnostics:
    logLevel: info
    debugEndpoints: false
    passthroughHeaders: false
  demoData:
    enabled: false
  limitsProfile: production_like
config:
  secretRefs:
    gatewayTls:
      existingSecret: in-falcone-staging-api-tls
      keys:
      - tls.crt
      - tls.key
deployment:
  topology:
    clusterRef: cluster-staging-shared
# repair-staging-infrastructure-20260809: disable the bundled ESO controller/CRDs so the
# release installs beside the administrator-owned controller named by
# global.externalSecrets.operatorNamespace. The Falcone auth identity stays in eso-system.
eso:
  external-secrets:
    enabled: false
  eso:
    namespace: eso-system
openbao:
  eso:
    namespace: eso-system
  openbao:
    authReconcile:
      allowRecoveryRoot: false
apisix:
  replicas: 3
controlPlane:
  replicas: 2
  # Immutable first-party image digests from the approved staging rollout. Helm becomes
  # authoritative for these Deployments without reverting them to older chart defaults.
  # Only digests (never mutable tags, never `kubectl set image`) are a supported staging
  # rollout path; re-verify each digest against the approved live/main rollout before an
  # upgrade. A digest wins over the chart-default tag in component-wrapper.renderImage.
  image:
    digest: sha256:adead18f61c601b016b46af29bcb8d3959bb7956cde4f37775fff6abf6278253
  functionExecutor:
    runtimeImage:
      digest: sha256:3329ffdd4a4f97f5dd6818f256507789495fc21d4f0d2a7fdfdf3148a4d15613
controlPlaneExecutor:
  image:
    digest: sha256:91c5e8dbc66cf2a10a4c7545d2822624f165f9d39fa3847e5645ed394ef4aa6c
webConsole:
  replicas: 2
  image:
    digest: sha256:9c540d1c12f3adf9efbb80a08a314b1dd2b3a3e1443784125a020b9345026191
workflowWorker:
  image:
    digest: sha256:fd98a3683aa3457bfda00ea05f1563cd398b951fad22af4f2b7e6b27b038087d
mcp:
  runtimeImage:
    digest: sha256:03f1eeaf932a3c87d581e596645f27f3a5d3da04df4b59341bd23fe32e9abfcb
# repair-staging-infrastructure-20260809: staging-only pgvector storage contract.
# The evidenced cluster exposes only the default `local-path` StorageClass (no HCloud
# CSI/`hcloud-volumes`), so the claim selects local-path and pins first placement to the
# durable Hetzner `fsn1` node — never the ephemeral kind/github-actions test nodes.
# WARNING: this profile is single-replica, node-local, `Delete` reclaim and NOT HA. It is
# a staging development contract only; base/prod/HA/OpenShift storage defaults are
# unchanged and MUST NOT inherit local-path. Loss/replacement of the fsn1 node loses the
# volume. See docs/staging-storage-and-dr.md.
postgresqlVector:
  persistence:
    storageClass: local-path
  nodeSelector:
    topology.kubernetes.io/region: fsn1
gatewayPolicy:
  passthrough:
    mode: disabled
  cors:
    allowOrigins:
    - https://console.staging.in-falcone.example.com
  oidc:
    issuerUrl: https://iam.staging.in-falcone.example.com/auth/realms/in-falcone-platform
    discoveryUrl: https://iam.staging.in-falcone.example.com/auth/realms/in-falcone-platform/.well-known/openid-configuration
